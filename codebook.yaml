  # Study ----------------------------------------------------------------------

  study:
    label: Study
    type: integer
    required: true
    min: 1
    description: A number that identifies the study within its paper.

  study_n:
    label: Sample size
    type: integer
    min: 1
    required: true
    description: >-
      The number of participants or observations in the study that were
      retained for analysis. For studies with several measurement points, the
      number at the earliest one.

  study_preregistered:
    label: Preregistered
    type: factor
    required: true
    description: Whether the study was preregistered.
    levels:
      - value: "yes"
        label: Preregistered
        description: Study design registered before data collection
      - value: "no"
        label: Not preregistered

  study_preregistration_link:
    label: Preregistration URL
    type: url
    description: A link to the study's preregistration.

  study_data_available:
    label: Data available
    type: factor
    required: true
    description: Whether the study's data are publicly available.
    levels:
      - value: "yes"
        label: Data available
        description: Study datasets can be downloaded
      - value: "no"
        label: Data not available

  study_data_link:
    label: Data URL
    type: url
    description: A link to the study's data.

  study_design:
    label: Design
    type: factor
    required: true
    description: >-
      Whether the conditions were compared between different participants,
      within the same participants, or both.
    levels:
      - value: between
        label: Between-subjects
        description: Different participants per condition
      - value: within
        label: Within-subjects
        description: >-
          Same participants across conditions, e.g. a pre-post design
      - value: mixed
        label: Mixed design
        description: >-
          Combines between and within elements, e.g. a pre-post design with
          an intervention and a control group
      - value: crossover
        label: Crossover
        description: Participants rotate through conditions in different orders

  study_condition_assignment:
    label: Condition assignment
    type: factor
    required: true
    description: The unit to which conditions were assigned.
    levels:
      - value: individual
        label: Individual assignment
        description: Participants assigned to conditions
      - value: cluster
        label: Cluster assignment
        description: >-
          Groups assigned to conditions, e.g. schools or restaurants
      - value: time point
        label: Time-based assignment
        description: >-
          Conditions assigned to time periods, e.g. control on day 1 and
          intervention on day 2

  study_randomization:
    label: Randomization
    type: factor
    required: true
    description: >-
      Whether conditions were randomly assigned. Pre-post designs, crossover
      designs, and self-selection into conditions are not randomized.
    levels:
      - value: "yes"
        label: Randomized assignment
        description: Eliminates selection bias
      - value: "no"
        label: Non-randomized assignment
        description: Potential for confounding

  # Draft columns for the new study design scheme: not in use yet, and not
  # described in the methodology (section 2.1 covers the current scheme).
  # Definitions to follow once the scheme is settled.

  study_condition_assignment_unit:
    status: draft
    description: TODO

  study_cluster_label:
    status: draft
    description: TODO

  study_cluster_k:
    status: draft
    description: TODO

  study_condition_assignment_process:
    status: draft
    description: TODO

  study_condition_assignment_structure:
    status: draft
    description: TODO

  study_measurement_unit:
    status: draft
    description: TODO

  study_data_tracking:
    status: draft
    description: TODO

  study_pseudoreplication_risk:
    status: draft
    description: TODO

  study_crossover_contamination_risk:
    status: draft
    description: TODO

  study_rct:
    status: draft
    description: TODO

  study_notes:
    label: Notes
    type: string
    description: Remarks about the study.

  # Sample ---------------------------------------------------------------------

  sample:
    label: Sample
    type: integer
    required: true
    min: 1
    description: A number that identifies the sample within its study.
    notes: >-
      Each study has a "(total)" sample with all participants, plus one
      sample per condition (and per period, if relevant).

  sample_label:
    label: Sample
    type: string
    required: true
    description: A short description of the sample, e.g. "(total)" or the condition it received.

  sample_n:
    label: Sample size
    type: integer
    min: 1
    description: The number of participants in the sample.

  sample_gender_f_n:
    label: Women (n)
    type: number
    min: 0
    description: The number of female participants in the sample.

  sample_gender_f_pct:
    label: Women (%)
    type: number
    min: 0
    max: 100
    description: The percentage of female participants in the sample.

  sample_gender_m_n:
    label: Men (n)
    type: number
    min: 0
    description: The number of male participants in the sample.

  sample_gender_m_pct:
    label: Men (%)
    type: number
    min: 0
    max: 100
    description: The percentage of male participants in the sample.

  sample_gender_other_n:
    label: Other gender (n)
    type: number
    min: 0
    description: The number of participants in the sample who are neither female nor male.

  sample_gender_other_pct:
    label: Other gender (%)
    type: number
    min: 0
    max: 100
    description: The percentage of participants in the sample who are neither female nor male.

  sample_age_mean:
    label: Mean age
    type: number
    min: 0
    description: The mean age of the participants in the sample.

  sample_age_sd:
    label: Age SD
    type: number
    min: 0
    description: The standard deviation of the participants' age.

  sample_age_min:
    label: Minimum age
    type: number
    min: 0
    description: The age of the youngest participant in the sample.

  sample_age_max:
    label: Maximum age
    type: number
    min: 0
    description: The age of the oldest participant in the sample.

  sample_description:
    label: Description
    type: string
    description: >-
      A brief description of who the participants were, e.g. residents of a
      mid-sized city in Australia.

  sample_type:
    label: Sample type
    type: factor
    multiple: true
    required: true
    description: Where the participants came from.
    levels:
      - value: public
        label: Public
        description: >-
          Members of the public recruited through flyers, social media ads,
          door-to-door canvassing, or at a venue
      - value: university
        label: University
        description: University students or staff recruited on campus
      - value: panel
        label: Panel
        description: >-
          Participants recruited via a recruitment service such as MTurk,
          Prolific, or Kantar
      - value: children
        label: Children
        description: Samples of children or minors

  sample_representative:
    label: Representative
    type: factor
    required: true
    description: >-
      Whether the sample was broadly representative of the country's
      population, e.g. in gender, age, income, and political orientation.
    levels:
      - value: "yes"
        label: Representative
        description: Efforts were made to recruit a representative sample of the population
      - value: "no"
        label: Not representative

  sample_recruitment_location:
    label: Recruitment
    type: string
    description: >-
      Where or how participants were recruited, e.g. a specific campus or
      social media ads.

  sample_country:
    label: Country
    type: string
    multiple: true
    required: true
    description: >-
      The country or countries where the sample was collected, as English
      country names separated by commas. "Unspecified" when the paper doesn't
      say.
    app_description: >-
      The country where the sample was collected. "Multiple countries" when it
      was collected in more than one, and "Unspecified" when the paper doesn't
      say.

  sample_compensation:
    label: Compensation
    type: string
    description: What participants received for taking part, and how much.

  sample_notes:
    label: Notes
    type: string
    description: Remarks about the sample.

  # Condition ------------------------------------------------------------------

  condition:
    label: Condition
    type: integer
    required: true
    min: 1
    description: A number that identifies the condition within its study.

  condition_label:
    label: Condition
    type: string
    required: true
    description: A short label for the condition.

  condition_category:
    label: Condition type
    type: factor
    required: true
    description: Whether the condition is a control or an intervention.
    levels: [control, intervention]
    notes: Controls leave the intervention_* columns empty.

  condition_description:
    label: Description
    type: string
    description: A detailed description of the condition, usually copied verbatim from the paper.

  intervention_count:
    label: Number of interventions
    type: integer
    min: 0
    description: >-
      How many qualitatively different interventions participants in the
      condition were exposed to.

  intervention_multicomponent:
    label: Intervention components
    type: factor
    description: Whether the intervention is based on more than one mechanism.
    levels:
      - value: "no"
        label: Single-component
        description: Intervention is based on one mechanism
      - value: "yes"
        label: Multicomponent
        description: Intervention is based on several mechanisms
    notes: >-
      Follows intervention_mechanism: "yes" when it lists more than one
      mechanism, "no" when it lists one.

  intervention_duration:
    label: Duration (days)
    type: integer
    min: 0
    description: >-
      How long the intervention lasted, in days. Interventions shorter than
      half a day are coded 0.
    notes: Required for interventions, not for controls.

  intervention_mechanism:
    label: Mechanism
    type: factor
    multiple: true
    description: >-
      The pathway via which the intervention is expected to change behavior.
      Section 2.2 of the methodology describes each mechanism, with examples.
    levels:
      - value: "info: health"
        label: Information (health)
        description: Information on the negative effects of meat consumption on health.
      - value: "info: environment"
        label: Information (environment)
        description: Information on the negative effects of meat consumption on the environment and climate.
      - value: "info: animal welfare"
        label: Information (animal welfare)
        description: Information on the negative effects of meat consumption on animal welfare.
      - value: "info: taste/disgust"
        label: Information (taste/disgust)
        description: >-
          Information on the tastiness of vegetarian food, or on aspects of
          meat consumption meant to evoke disgust.
      - value: "authority/role models"
        label: Authority/role models
        description: Authority figures or role models who advocate against meat consumption.
      - value: "norms: descriptive"
        label: Norms (descriptive)
        description: Information on how common an attitude or behavior is.
      - value: "norms: dynamic"
        label: Norms (dynamic)
        description: Information on how an attitude or behavior is becoming more common.
      - value: "identity/reputation"
        label: Identity/reputation
        description: >-
          Activating image concerns, or highlighting how desirable traits or
          values favor vegetarian choices.
      - value: "hedonic labeling"
        label: Hedonic labeling
        description: Appealing names for dishes that promote vegetarian choices.
      - value: "origin of animal product"
        label: Origin of animal product
        description: Connecting an animal product to the animal it comes from.
      - value: "perspective taking/individuation"
        label: Perspective taking/individuation
        description: >-
          Introducing individual animals, or prompting participants to imagine
          what it's like to be an animal.
      - value: "priming"
        label: Priming
        description: >-
          Visual or other sensory stimuli meant to induce emotions, thoughts, or
          goals conducive to plant-based choices.
      - value: "choice architecture: default"
        label: Choice architecture (default)
        description: Making the vegetarian option the default.
      - value: "choice architecture: visibility/salience/ease"
        label: Choice architecture (visibility/salience/ease)
        description: Making vegetarian options more visible, salient, or easier to choose.
      - value: "choice architecture: availability/variety/size"
        label: Choice architecture (availability/variety/size)
        description: >-
          Offering more or more varied vegetarian options, or less meat in
          dishes.
      - value: "goal pursuit: planning/pledge/reminder"
        label: Goal pursuit (planning/pledge/reminder)
        description: >-
          Prompting people to pledge to change, helping them plan a change, or
          reminding them of their plans.
      - value: "goal pursuit: efficacy/consequences/feedback"
        label: Goal pursuit (efficacy/consequences/feedback)
        description: >-
          Highlighting the positive consequences of eating less meat, or giving
          feedback on progress.
      - value: "goal pursuit: food provision"
        label: Goal pursuit (food provision)
        description: Providing free meat replacements or other vegetarian food.
      - value: "goal pursuit: cooking skills"
        label: Goal pursuit (cooking skills)
        description: Helping people plan and cook vegetarian meals.
      - value: "taste"
        label: Taste
        description: Improving the taste of vegetarian dishes.
      - value: "price/tax/incentives"
        label: Price
        description: >-
          Reducing the price of vegetarian options relative to meat options, or
          rewarding vegetarian choices.
      - value: "other"
        label: Other
        description: Interventions that don't fit one of the other mechanisms.

  intervention_medium:
    label: Medium
    type: factor
    multiple: true
    description: How the intervention was delivered.
    levels:
      - value: text
        label: Text
      - value: presentation
        label: Presentation
      - value: video
        label: Video
      - value: 3D video
        label: 3D video
      - value: image
        label: Image
      - value: choice architecture
        label: Choice architecture
      - value: in-person
        label: In person
      - value: label
        label: Label
      - value: "price/tax/incentives"
        label: Price
      - value: other
        label: Other

  condition_notes:
    label: Notes
    type: string
    description: Remarks about the condition.

  # Outcome --------------------------------------------------------------------

  outcome:
    label: Outcome
    type: integer
    required: true
    min: 1
    description: A number that identifies the outcome measure within its study.

  outcome_label:
    label: Outcome
    type: string
    required: true
    description: A short label for the outcome measure.

  outcome_description:
    label: Description
    type: string
    required: true
    description: How the outcome was measured.

  time:
    label: Time
    type: integer
    required: true
    description: >-
      The measurement point of the outcome. Negative numbers are measurements
      before the intervention (-1 is the last one before it), positive numbers
      are measurements after it (1 is the first one after it). 0 isn't used.
    notes: >-
      An outcome has one row per measurement point. Times are numbered per
      outcome, not across the study: an outcome measured at baseline and only
      at the second follow-up has times -1 and 1. Effects on the website use
      the latest measurement point of each outcome.

  time_label:
    label: Time
    type: string
    required: true
    description: A short description of the measurement point, e.g. "baseline" or "4-week follow-up".

  outcome_days_since_intervention_min:
    label: Days since intervention (min)
    type: integer
    required: true
    description: >-
      How many days after the intervention the outcome was measured; the
      minimum if measurement took several days. 0 means the same day, and
      negative numbers mean before the intervention.

  outcome_days_since_intervention_max:
    label: Days since intervention (max)
    type: integer
    required: true
    description: >-
      How many days after the intervention the outcome was measured; the
      maximum if measurement took several days. 0 means the same day, and
      negative numbers mean before the intervention.

  outcome_expectation:
    label: Expected direction
    type: factor
    required: true
    description: >-
      Whether the intervention is expected to increase or decrease the
      outcome. Effect sizes on the website are flipped by this, so that
      positive always means a change in the intended direction.
    levels: [increase, decrease]

  outcome_category:
    label: Outcome category
    type: factor
    required: true
    description: What kind of outcome was measured.
    levels:
      - value: attitudes/beliefs
        label: Attitudes/beliefs
        description: >-
          E.g. scores on a meat attachment questionnaire, or anticipated
          enjoyment of plant-based dishes.
      - value: behavior - observed
        label: Behaviors (observed)
        description: E.g. vegetarian sales records, or meal choices at events.
      - value: behavior - self-reported
        label: Behaviors (self-reported)
        description: E.g. self-reported meat consumption, food diaries, or 24-hour recalls.
      - value: intentions
        label: Intentions
        description: >-
          E.g. intentions to reduce future meat consumption, or hypothetical
          choices of vegetarian dishes.

  outcome_subcategory:
    label: Outcome subcategory
    type: factor
    required: true
    description: >-
      A more specific kind of outcome within the outcome category. Section 2.3
      of the methodology describes each subcategory.
    levels:
      - value: meat attitude
        description: General evaluations of meat or meat eaters.
        requires:
          outcome_category: [attitudes/beliefs]
      - value: meat belief
        description: >-
          Beliefs about the consequences of eating meat, e.g. that eating pork
          contributes to the suffering of pigs.
        requires:
          outcome_category: [attitudes/beliefs]
      - value: meat hedonics
        description: Perceived tastiness and anticipated enjoyment of meat products.
        requires:
          outcome_category: [attitudes/beliefs]
      - value: moral judgment
        description: Judgments about the ethicality of eating meat.
        requires:
          outcome_category: [attitudes/beliefs]
      - value: vegan hedonics
        description: Perceived tastiness and anticipated enjoyment of vegan products.
        requires:
          outcome_category: [attitudes/beliefs]
      - value: vegetarian attitude
        description: General evaluations of vegetarian food or vegetarians.
        requires:
          outcome_category: [attitudes/beliefs]
      - value: vegetarian hedonics
        description: Perceived tastiness and anticipated enjoyment of vegetarian products.
        requires:
          outcome_category: [attitudes/beliefs]
      - value: animal product consumption
        description: Consumption of animal products.
        requires:
          outcome_category: [behavior - observed, behavior - self-reported]
      - value: dairy consumption
        description: Consumption of dairy.
        requires:
          outcome_category: [behavior - observed, behavior - self-reported]
      - value: egg consumption
        description: Consumption of eggs.
        requires:
          outcome_category: [behavior - self-reported]
      - value: meat consumption
        description: Consumption of meat.
        requires:
          outcome_category: [behavior - observed, behavior - self-reported]
      - value: vegan consumption
        description: Consumption of vegan food.
        requires:
          outcome_category: [behavior - observed, behavior - self-reported]
      - value: vegetarian consumption
        description: Consumption of vegetarian food.
        requires:
          outcome_category: [behavior - observed, behavior - self-reported]
      - value: diet
        description: Self-reported diet, e.g. omnivorous, vegetarian, or vegan.
        requires:
          outcome_category: [behavior - self-reported]
      - value: donation
        description: Donations to animal advocacy, e.g. part of a study bonus.
        notes: >-
          Coded to keep the information, but its effects are excluded from the
          meta-analysis (effect_exclude) because it isn't about diet.
        requires:
          outcome_category: [behavior - observed]
      - value: animal product intentions
        description: Intentions to change one's consumption of animal products.
        requires:
          outcome_category: [intentions]
      - value: diet intentions
        description: Intentions to change one's diet, e.g. to become vegetarian.
        requires:
          outcome_category: [intentions]
      - value: meat consumption intentions
        description: Intentions to change one's consumption of meat.
        requires:
          outcome_category: [intentions]
      - value: vegan consumption intentions
        description: Intentions to change one's consumption of vegan food.
        requires:
          outcome_category: [intentions]
      - value: vegetarian consumption intentions
        description: Intentions to change one's consumption of vegetarian food.
        requires:
          outcome_category: [intentions]
      - value: signing a petition
        description: Intentions to support petitions or policies that reduce meat consumption.
        notes: >-
          Coded to keep the information, but its effects are excluded from the
          meta-analysis (effect_exclude) because it isn't about diet.
        requires:
          outcome_category: [intentions]
      - value: other
        description: Outcomes that don't fit one of the other subcategories.

  outcome_measurement_type:
    label: Measure
    type: factor
    required: true
    description: The kind of instrument used to record the outcome.
    levels:
      - value: survey
        label: Survey
        description: >-
          Questionnaires that capture self-reported attitudes, beliefs, or
          intentions with single items or multi-item scales
      - value: food diary
        label: Food diary
        description: >-
          Detailed records of food consumption, e.g. 24-hour recalls or food
          frequency questionnaires
      - value: sales data
        label: Sales data
        description: Records of products sold in a restaurant, supermarket, or other venue
      - value: meal choice
        label: Meal choice
        description: Real or hypothetical choices of specific dishes or products

  outcome_product_type:
    label: Product type
    type: factor
    multiple: true
    description: >-
      The kind of animal product the outcome is specifically about, if any.
      Empty for outcomes about animal products or diet in general.
    levels: [meat, eggs, dairy]

  outcome_product_subtype:
    label: Product subtype
    type: factor
    multiple: true
    description: >-
      The more specific animal product the outcome is about, if any. Requires
      the matching product type.
    levels:
      - value: red meat
        requires: {outcome_product_type: [meat]}
      - value: white meat
        requires: {outcome_product_type: [meat]}
      - value: processed meat
        requires: {outcome_product_type: [meat]}
      - value: red and processed meat
        requires: {outcome_product_type: [meat]}
      - value: beef
        requires: {outcome_product_type: [meat]}
      - value: veal
        requires: {outcome_product_type: [meat]}
      - value: pork
        requires: {outcome_product_type: [meat]}
      - value: lamb
        requires: {outcome_product_type: [meat]}
      - value: poultry
        requires: {outcome_product_type: [meat]}
      - value: chicken
        requires: {outcome_product_type: [meat]}
      - value: turkey
        requires: {outcome_product_type: [meat]}
      - value: fish
        requires: {outcome_product_type: [meat]}
      - value: seafood
        requires: {outcome_product_type: [meat]}
      - value: shrimp
        requires: {outcome_product_type: [meat]}
      - value: milk
        requires: {outcome_product_type: [dairy]}
      - value: cheese
        requires: {outcome_product_type: [dairy]}
      - value: yoghurt
        requires: {outcome_product_type: [dairy]}
      - value: butter
        requires: {outcome_product_type: [dairy]}

  outcome_is_suboutcome:
    label: Suboutcome
    type: integer
    required: true
    min: 0
    max: 1
    description: >-
      Whether the outcome is part of a broader outcome measure. Some papers
      report both an overall measure and the measures it consists of, e.g.
      meat consumption and its parts: chicken, beef, and pork consumption.
      1 for the parts (suboutcomes), 0 for the overall measure and for
      outcomes that aren't split up.

  outcome_scale:
    label: Scale
    type: string
    description: The scale the outcome was measured on, e.g. a 7-point Likert scale.

  outcome_notes:
    label: Notes
    type: string
    description: Remarks about the outcome.

  # Statistics -----------------------------------------------------------------

  time_1:
    label: Time
    type: integer
    required: true
    description: >-
      The measurement point (time on Outcome-level) the statistics are from.
      For change scores, the later of the two measurement points.

  time_1_label:
    label: Time label
    type: string
    description: The time_label of time_1.

  time_2:
    label: Baseline time
    type: integer
    description: >-
      For change scores: the measurement point the change is relative to,
      usually the baseline. Empty otherwise.

  time_2_label:
    label: Baseline time label
    type: string
    description: The time_label of time_2.

  statistics:
    label: Statistics group
    type: integer
    required: true
    min: 1
    description: >-
      A number that identifies a group of statistics: the statistics for one
      condition, sample, outcome, and measurement point. Numbered across the
      paper.

  statistic:
    label: Statistic
    type: integer
    required: true
    min: 1
    description: A number that identifies the statistic within its group.

  statistic_name:
    label: Statistic
    type: factor
    required: true
    description: Which statistic the row holds.
    levels:
      - value: "n"
        description: Number of participants or observations.
      - value: successes
        description: Number of participants or observations with the outcome, e.g. vegetarian meals chosen.
      - value: failures
        description: Number of participants or observations without the outcome.
      - value: percentage
        description: Successes as a percentage of n (0-100).
      - value: M
        description: Mean.
      - value: SD
        description: Standard deviation.
      - value: SE
        description: Standard error of the mean.
      - value: beta
        description: A regression coefficient.

  statistic_value:
    label: Value
    type: number
    required: true
    description: The value of the statistic.

  statistic_from_paper:
    label: From paper
    type: factor
    description: Whether the value was taken directly from the paper.
    levels:
      - value: "yes"
        description: Reported in the paper (or its supplement).
      - value: "no"
        description: Calculated from other reported values, e.g. failures as n minus successes.
      - value: approx.
        description: >-
          Estimated, e.g. a per-condition n from splitting the total equally,
          or a value read from a figure. Explain how in statistic_notes.

  statistic_notes:
    label: Notes
    type: string
    description: Remarks about the statistic, e.g. where it comes from or how it was calculated.

  # Effects --------------------------------------------------------------------

  intervention_condition:
    label: Intervention condition
    type: integer
    required: true
    description: The intervention condition of the comparison.

  intervention_time_1:
    label: Intervention time
    type: integer
    required: true
    description: The measurement point of the intervention group's statistics.

  intervention_time_2:
    label: Intervention baseline time
    type: integer
    description: >-
      For difference-in-differences: the measurement point of the intervention
      group's second statistics group (intervention_statistics_2).

  intervention_label:
    label: Intervention
    type: string
    description: The condition_label of the intervention condition.

  intervention_sample:
    label: Intervention sample
    type: integer
    description: The sample of the intervention group.

  control_condition:
    label: Control condition
    type: integer
    required: true
    description: The control condition of the comparison.

  control_time_1:
    label: Control time
    type: integer
    required: true
    description: The measurement point of the control group's statistics.

  control_time_2:
    label: Control baseline time
    type: integer
    description: >-
      For difference-in-differences: the measurement point of the control
      group's second statistics group (control_statistics_2).

  control_label:
    label: Control
    type: string
    description: The condition_label of the control condition.

  control_sample:
    label: Control sample
    type: integer
    description: The sample of the control group.

  effect:
    label: Effect
    type: integer
    required: true
    min: 1
    description: A number that identifies the effect. Numbered across the paper.

  intervention_statistics_1:
    label: Intervention statistics
    type: integer
    required: true
    description: >-
      The statistics group of the intervention side of the comparison. Also
      needed for effects reported directly by the paper; the group can then
      hold just n.

  intervention_statistics_2:
    label: Intervention statistics (2)
    type: integer
    description: >-
      For difference-in-differences: the intervention group's statistics at
      the other measurement point.

  control_statistics_1:
    label: Control statistics
    type: integer
    required: true
    description: >-
      The statistics group of the control side of the comparison. Also needed
      for effects reported directly by the paper; the group can then hold
      just n.

  control_statistics_2:
    label: Control statistics (2)
    type: integer
    description: >-
      For difference-in-differences: the control group's statistics at the
      other measurement point.

  effect_size_name:
    label: Effect size type
    type: factor
    required: true
    description: >-
      The kind of effect size. Only OR2DL, OR2DL DiD, SMCC, SMD, SMD DiD, and
      g are included in the meta-analysis; the others are kept for reference.
    levels:
      - value: SMD
        description: Standardized mean difference (Hedges' g), calculated from means and SDs.
      - value: SMD DiD
        description: >-
          Difference-in-differences on means (Morris, 2008): the change in the
          intervention group minus the change in the control group, divided by
          the pooled pre-test SD. Uses the _2 statistics groups for the
          pre-test and the pre-post correlation (effect_r).
      - value: OR2DL
        description: Log odds ratio converted to a standardized mean difference (√3/π), calculated from counts.
      - value: OR2DL DiD
        description: >-
          Difference-in-differences on counts: the change in log odds in the
          intervention group minus the change in the control group, converted
          with √3/π. Uses the _2 statistics groups for the pre-test.
      - value: SMCC
        description: >-
          Standardized mean change for the same participants measured twice,
          using the pre-post correlation (effect_r).
      - value: g
        description: Hedges' g reported or converted from another effect size.
      - value: d
        description: Cohen's d as reported by the paper.
      - value: OR
        description: Odds ratio as reported by the paper.
      - value: IRR
        description: Incidence rate ratio as reported by the paper.
      - value: eta squared
        description: Eta squared as reported by the paper.
      - value: partial eta squared
        description: Partial eta squared as reported by the paper.

  effect_r:
    label: Pre-post correlation
    type: number
    min: -1
    max: 1
    description: >-
      The correlation between the two measurements of the same participants,
      used for SMCC effects.

  effect_size:
    label: Effect size
    type: number
    description: >-
      The effect size. Positive means the intervention group's raw value is
      higher than the control group's, regardless of outcome_expectation.
    app_description: >-
      The effect size. Positive means the outcome changed in the direction the
      intervention intended (e.g. less meat consumption, or more vegetarian
      choices).

  effect_size_lower:
    label: Lower bound
    type: number
    description: The lower bound of the effect size's 95% confidence interval.

  effect_size_upper:
    label: Upper bound
    type: number
    description: The upper bound of the effect size's 95% confidence interval.

  effect_size_var:
    label: Effect variance
    type: number
    min: 0
    description: The sampling variance of the effect size.

  effect_size_se:
    label: Standard error
    type: number
    min: 0
    description: The standard error of the effect size, the square root of effect_size_var.

  effect_analysis:
    label: Analysis
    type: factor
    description: The statistical test the effect is based on.
    levels:
      - "Welch's t-test"
      - "One-sample t-test"
      - "Paired-sample t-test"
      - "ANOVA"
      - "ANCOVA"
      - "MANCOVA"
      - "Planned contrast"
      - "Pearson's chi-squared test"
      - "Fisher's exact test"
      - "Logistic regression"
      - "Mixed regression model"
      - "Meta-analytic estimate"

  effect_statistic_name:
    label: Test statistic
    type: factor
    description: The name of the test statistic.
    levels: ["t", "F", "chi-squared", "z"]

  effect_statistic_value:
    label: Test statistic value
    type: number
    description: The value of the test statistic.

  effect_df:
    label: df
    type: number
    min: 0
    description: The degrees of freedom of the test.

  effect_df_num:
    label: df (numerator)
    type: number
    min: 0
    description: The numerator degrees of freedom of an F test.

  effect_df_den:
    label: df (denominator)
    type: number
    min: 0
    description: The denominator degrees of freedom of an F test.

  effect_p:
    label: p
    type: string
    description: >-
      The p-value of the test. When effect_from_paper is "yes", as reported,
      including thresholds like "<0.001". When we calculated the effect, the
      exact p.

  effect_from_paper:
    label: From paper
    type: factor
    required: true
    description: Whether the effect size was taken directly from the paper.
    levels: ["yes", "no"]

  effect_covariates:
    label: Covariates
    type: string
    description: The covariates the effect was adjusted for, if any.

  effect_exclude:
    label: Exclude
    type: factor
    required: true
    description: Whether the effect is left out of the meta-analysis.
    levels:
      - value: "yes"
        description: Left out; effect_notes says why.
      - value: "no"
        description: Included in the meta-analysis.
      - value: maybe
        description: Not decided yet. Papers with status "included" shouldn't have these.
    notes: >-
      A comparison can have several rows, e.g. a reported odds ratio and the
      g converted from it. Exactly one of them has "no".

  effect_notes:
    label: Notes
    type: string
    description: >-
      Remarks about the effect, e.g. how it was calculated or why it's
      excluded.

  # Derived (website only) -----------------------------------------------------

  paper_study:
    label: Paper-study
    type: string
    derived: true
    description: The paper and study numbers combined, e.g. "12 - 2"; identifies a study across papers.

  intervention_description:
    label: Intervention
    type: string
    derived: true
    description: The condition_description of the intervention condition.

  control_description:
    label: Control
    type: string
    derived: true
    description: The condition_description of the control condition.

  intervention_mechanism_multicomponent:
    label: Multiple mechanisms
    type: factor
    derived: true
    description: Whether the intervention targets more than one mechanism.
    levels: ["yes", "no"]

  intervention_medium_multicomponent:
    label: Multiple media
    type: factor
    derived: true
    description: Whether the intervention uses more than one medium.
    levels: ["yes", "no"]

  intervention_sample_n:
    label: Sample size (intervention sample)
    type: integer
    derived: true
    description: >-
      The sample_n of the intervention group's sample. Can differ from
      effect_intervention_n, e.g. because of missing data on the outcome.

  intervention_sample_description:
    label: Intervention sample
    type: string
    derived: true
    description: The sample_description of the intervention group's sample.

  control_sample_n:
    label: Sample size (control sample)
    type: integer
    derived: true
    description: >-
      The sample_n of the control group's sample. Can differ from
      effect_control_n, e.g. because of missing data on the outcome.

  control_sample_description:
    label: Control sample
    type: string
    derived: true
    description: The sample_description of the control group's sample.

  intervention_key:
    label: Intervention key
    type: string
    derived: true
    description: >-
      Identifies the intervention group (condition, sample, and measurement
      points), used to model effects that share a group.

  control_key:
    label: Control key
    type: string
    derived: true
    description: >-
      Identifies the control group (condition, sample, and measurement
      points), used to model effects that share a control group. Empty for
      single-group (SMCC) effects.

  effect_intervention_n:
    label: Sample size (intervention)
    type: integer
    derived: true
    description: The n in the intervention group's statistics for this effect.

  effect_control_n:
    label: Sample size (control)
    type: integer
    derived: true
    description: The n in the control group's statistics for this effect.

  has_mechanism:
    label: Has mechanism
    type: integer
    derived: true
    pattern: "^has_mechanism_"
    description: >-
      One column per intervention mechanism, e.g. has_mechanism_info_health:
      1 when the intervention targets that mechanism, otherwise 0.

  has_medium:
    label: Has medium
    type: integer
    derived: true
    pattern: "^has_medium_"
    description: >-
      One column per intervention medium, e.g. has_medium_video: 1 when the
      intervention uses that medium, otherwise 0.
