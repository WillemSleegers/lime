columns:

  # Paper ----------------------------------------------------------------------

  paper:
    label: Paper
    type: integer
    required: true
    min: 1
    description: A number that identifies the paper.

  paper_label:
    label: Paper
    type: string
    required: true
    description: >-
      A short label for the paper in APA in-text citation style: the authors
      and year of publication, e.g. "Carfora et al. (2017b)". Papers with one
      or two authors list them all; papers with more list the first author
      followed by "et al.".

  paper_status:
    label: Status
    type: factor
    required: true
    description: >-
      Where the paper is in the coding process. paper_status_detail gives the
      reason or the next step.
    levels:
      - value: unscreened
        description: Not yet checked against the inclusion criteria.
      - value: in progress
        description: Meets the inclusion criteria and is being coded.
      - value: included
        description: >-
          Coded and included on the website. It can still be waiting on the
          authors for statistics for more effects.
      - value: excluded
        description: >-
          Not included on the website: it doesn't meet the inclusion criteria,
          or the statistics needed for an effect size aren't available (yet).

  paper_status_detail:
    label: Status detail
    type: factor
    description: >-
      Why a paper is excluded, what an in-progress paper needs next, or
      whether the authors are being asked for statistics.
    levels:
      - value: ineligible
        description: Doesn't meet the inclusion criteria.
        requires:
          paper_status: [excluded]
      - value: paper inaccessible
        description: The full text couldn't be accessed.
        requires:
          paper_status: [excluded]
      - value: data unavailable
        description: >-
          Meets the inclusion criteria, but the statistics needed for an
          effect size aren't available, not even from the authors.
        requires:
          paper_status: [excluded]
      - value: contact authors
        description: >-
          Statistics needed for an effect size aren't reported; the authors
          need to be asked for them. For an included paper: for more effects.
        requires:
          paper_status: [excluded, included]
      - value: contacted
        description: The authors have been asked for the missing statistics.
        requires:
          paper_status: [excluded, included]
      - value: ready to code
        description: Meets the inclusion criteria; the paper still needs to be coded.
        requires:
          paper_status: [in progress]
      - value: analyze raw data
        description: >-
          Statistics needed for an effect size aren't reported, but can be
          calculated from the shared raw data.
        requires:
          paper_status: [in progress]
      - value: calculate effect sizes
        description: Coded; the effect sizes still need to be calculated.
        requires:
          paper_status: [in progress]

  paper_authors:
    label: Authors
    type: string
    required: true
    description: >-
      The paper's authors as last name followed by initials, separated by
      semicolons.

  paper_year:
    label: Year
    type: integer
    required: true
    min: 1950
    description: The year the paper was published.

  paper_title:
    label: Title
    type: string
    required: true
    description: The title of the paper, in sentence case.

  paper_type:
    label: Paper type
    type: factor
    description: The kind of publication.
    levels:
      - value: peer reviewed paper
        label: Peer reviewed paper
        description: Journal articles
      - value: conference paper
        label: Conference paper
        description: Papers published in conference proceedings
      - value: preprint
        label: Preprint
        description: Publications that are not yet peer-reviewed
      - value: thesis
        label: Thesis
        description: Student research
      - value: report
        label: Report
        description: Government and institutional publications
      - value: unpublished manuscript
        label: Unpublished manuscript
        description: Manuscripts that are not publicly available

  paper_source:
    label: Source
    type: string
    description: >-
      Where the paper was published or is hosted, e.g. the journal or
      website.

  paper_link:
    label: URL
    type: url
    description: A link to the paper, usually its DOI.

  paper_open_access:
    label: Open access
    type: factor
    description: Whether the paper is free to read.
    levels:
      - value: open access
        label: Open access
        description: Free to read
      - value: paywalled
        label: Paywalled
        description: Paid access required
      - value: inaccessible
        label: Inaccessible
        description: Could not be accessed

  paper_coded_by:
    label: Coded by
    type: string
    multiple: true
    description: Who coded the paper, as first names separated by commas.

  paper_notes:
    label: Notes
    type: string
    description: >-
      Remarks about the paper, e.g. which statistics are missing, or why a
      relevant-looking paper was excluded.

  paper_extracted_all_statistics:
    label: All statistics extracted
    type: factor
    description: >-
      Whether all relevant statistics have been extracted from the paper. "no"
      means there may be more to code, usually for less relevant outcomes.
    levels: ["yes", "no"]

  code_study_level:
    label: Code study level
    type: factor
    status: temporary
    description: >-
      A working column for recoding the Study-level tab: whether the paper's
      studies still need their study-level variables coded.
    levels: ["ready to code", "no"]

  paper_in_paper:
    label: Included in
    type: factor
    multiple: true
    required: true
    description: >-
      Earlier meta-analyses, reviews, or databases that include the paper,
      used to find papers for LIME.
    notes: Levels must not contain commas, since cells are split on them.
    levels:
      - value: "Benningstad & Kunst (2020)"
        description: >-
          Benningstad, N. C. G., & Kunst, J. R. (2020). Dissociating meat from
          its animal origins: A systematic literature review. Appetite, 147,
          Article 104554. https://doi.org/10.1016/j.appet.2019.104554
      - value: "Bianchi et al. (2018a)"
