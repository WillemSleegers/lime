# LIME codebook
#
# The single source of truth for the columns of the LIME Google Sheet and the
# data the website publishes. r/validate.r checks the sheet against it, and
# r/meta-analysis.r writes the app's codebook JSON from it.
#
# sheets: one entry per sheet tab, in tab order
#   level:    the level of the data model the tab holds
#   columns:  the tab's columns, in sheet order
#   lookups:  columns filled by sheet formulas (look-ups from other tabs or
#             calculations); validate.r doesn't check them as entered data
#
# columns: one entry per column name; a name means the same thing on every tab
#   label:        short display name, used by the app
#   type:         integer | number | string | url | factor
#   description:  a plain-language definition of the column
#   levels:       allowed values of a factor, in display order. Each is a
#                 string, or a map with value, and optionally label,
#                 description, notes, and requires (see below)
#   multiple:     true when a cell can hold several comma-separated values
#   min, max:     allowed range of a number
#   required:     true when every row must have a value
#   status:       temporary (in use, will be removed) or draft (not yet in
#                 use; validate.r only checks that the column exists)
#   derived:      true for columns that r/meta-analysis.r creates for the
#                 website; they're not in the sheet
#   pattern:      for derived columns: a regex matching a family of columns
#   app_description: replaces description in the app's codebook, when the
#                 published column differs from the sheet column
#   notes:        coding conventions and rules. Not the current state of the
#                 data (counts, what's coded so far): that goes stale, and
#                 validate.r can report it instead
#
# requires (on a level): the level is only allowed when another column in the
# same row holds one of the listed levels, e.g. a product subtype "beef" only
# with product type "meat". For a multi-value column, one match is enough.
#
# Quote "yes", "no", and single letters like "n" and "F": R's YAML parser
# reads them unquoted as true and false.

