      - sample_age_max
      - sample_description
      - sample_type
      - sample_representative
      - sample_recruitment_location
      - sample_country
      - sample_compensation
      - sample_notes
    lookups:
      - paper_label
      - sample_gender_f_n

  Condition-level:
    level: condition
    columns:
      - paper
      - paper_label
      - study
      - study_design
      - condition
